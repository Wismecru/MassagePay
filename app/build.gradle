plugins {
    id 'com.android.application'
}
android {
    namespace 'ua.massage.pay'
    compileSdk 34
    defaultConfig {
        applicationId 'ua.massage.pay'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        fixed {
            storeFile rootProject.file('release.keystore')
            storePassword 'massagepay'
            keyAlias 'massagepay'
            keyPassword 'massagepay'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
